      Social preview tags are declared statically here on purpose: LinkedIn,
      WhatsApp, Slack and X do not execute JavaScript, so tags injected at

      Absolute URLs use the github.io origin because it is what actually serves
      these files. raghunathchava.com is currently registrar frame-masking and
      returns 404 for every asset path, so a card pointing there would not load.
      Switch these to the apex domain once it is served by GitHub Pages directly.
    -->
